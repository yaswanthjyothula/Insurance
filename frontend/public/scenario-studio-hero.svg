<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Scenario Studio: one baseline, many life paths</title>
  <desc id="d">A protected family baseline branches into three what-if scenarios, each showing the change in required cover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E4FF"/><stop offset="0.6" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E4FF"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9277FF"/><stop offset="1" stop-color="#7957FF"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7957FF"/><stop offset="1" stop-color="#0E9F7E"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B5CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#463CB4" flood-opacity=".16"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter Tight','Helvetica Neue',sans-serif;fill:#24212B}
      .mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;letter-spacing:1.4px;fill:#6F6A7C;font-size:11px}
      .t{font-size:17px;font-weight:700}
      .s{font-size:13px;fill:#4A4553}
      .d{font-size:22px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="480" rx="32" fill="url(#bg)"/>
  <circle cx="230" cy="240" r="230" fill="url(#glow)"/>
  <g opacity=".5" stroke="#24212B" stroke-opacity=".05">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
  </g>

  <!-- branching paths -->
  <g fill="none" stroke="url(#path)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">
    <path d="M330 240 C 470 240, 470 90, 620 90"/>
    <path d="M330 240 L 620 240"/>
    <path d="M330 240 C 470 240, 470 390, 620 390"/>
  </g>
  <circle cx="620" cy="90" r="6" fill="#7957FF"/><circle cx="620" cy="240" r="6" fill="#0E9F7E"/><circle cx="620" cy="390" r="6" fill="#FF5C7A"/>

  <!-- baseline: shield + family -->
  <g filter="url(#sh)">
    <path d="M200 112 C 235 126 265 130 290 130 L290 225 C 290 290 250 335 200 358 C 150 335 110 290 110 225 L110 130 C 135 130 165 126 200 112 Z" fill="url(#brand)"/>
    <path d="M200 140 C 225 150 245 153 262 153 L262 225 C 262 270 235 303 200 320 C 165 303 138 270 138 225 L138 153 C 155 153 175 150 200 140 Z" fill="#FFFFFF" fill-opacity=".16"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="170" cy="228" r="11"/><path d="M152 285 v-30 a18 18 0 0 1 36 0 v30 z"/>
    <circle cx="230" cy="228" r="11"/><path d="M212 285 v-30 a18 18 0 0 1 36 0 v30 z"/>
    <circle cx="200" cy="252" r="8"/><path d="M187 285 v-17 a13 13 0 0 1 26 0 v17 z"/>
  </g>
  <rect x="120" y="372" width="160" height="30" rx="15" fill="#FFFFFF" stroke="#24212B" stroke-opacity=".1"/>
  <text x="200" y="392" text-anchor="middle" class="mono" style="font-size:10.5px">YOUR BASELINE</text>

  <!-- scenario cards -->
  <g filter="url(#sh)">
    <rect x="640" y="40" width="470" height="100" rx="20" fill="#FFFFFF" stroke="#7957FF" stroke-opacity=".25"/>
    <rect x="640" y="190" width="470" height="100" rx="20" fill="#FFFFFF" stroke="#0E9F7E" stroke-opacity=".3"/>
    <rect x="640" y="340" width="470" height="100" rx="20" fill="#FFFFFF" stroke="#FF5C7A" stroke-opacity=".3"/>
  </g>

  <!-- 1 another child -->
  <text x="668" y="72" class="mono">SCENARIO 01</text>
  <text x="668" y="98" class="t">Another child</text>
  <text x="668" y="120" class="s">Adds an education goal</text>
  <rect x="875" y="64" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="64" width="62" height="10" rx="5" fill="#7957FF" fill-opacity=".35"/>
  <rect x="875" y="86" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="86" width="86" height="10" rx="5" fill="#7957FF"/>
  <text x="985" y="104" class="d" style="fill:#7957FF">+₹37.5 L</text>
  <text x="985" y="126" class="s" style="font-size:12px">cover needed</text>

  <!-- 2 retire early -->
  <text x="668" y="222" class="mono">SCENARIO 02</text>
  <text x="668" y="248" class="t">Retire at 55</text>
  <text x="668" y="270" class="s">Shorter earning window</text>
  <rect x="875" y="214" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="214" width="62" height="10" rx="5" fill="#0E9F7E" fill-opacity=".35"/>
  <rect x="875" y="236" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="236" width="48" height="10" rx="5" fill="#0E9F7E"/>
  <text x="985" y="254" class="d" style="fill:#0E9F7E">−₹18 L</text>
  <text x="985" y="276" class="s" style="font-size:12px">cover needed</text>

  <!-- 3 loan cleared -->
  <text x="668" y="372" class="mono">SCENARIO 03</text>
  <text x="668" y="398" class="t">Home loan cleared</text>
  <text x="668" y="420" class="s">Debt drops to zero</text>
  <rect x="875" y="364" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="364" width="62" height="10" rx="5" fill="#FF5C7A" fill-opacity=".35"/>
  <rect x="875" y="386" width="90" height="10" rx="5" fill="#24212B" fill-opacity=".08"/><rect x="875" y="386" width="30" height="10" rx="5" fill="#FF5C7A"/>
  <text x="985" y="404" class="d" style="fill:#FF5C7A">−₹35 L</text>
  <text x="985" y="426" class="s" style="font-size:12px">cover needed</text>

  <!-- orbs -->
  <circle cx="400" cy="60" r="10" fill="#19C9A0" opacity=".85"/><circle cx="360" cy="430" r="7" fill="#FF7A9A" opacity=".85"/><circle cx="540" cy="170" r="5" fill="#5B8BFF" opacity=".85"/><circle cx="560" cy="330" r="6" fill="#FFB547" opacity=".85"/>
</svg>
